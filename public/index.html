<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#0d2d3d">
    <meta name="description" content="《魔鬼的計謀》第 3 季放逐區的數迴（Slitherlink），換你上場！畫出一條封閉迴路，挑戰三種難度、90 道原創關卡。手機、電腦點開就能玩。">
    <title>數迴 · Slitherlink</title>
    <link rel="icon" href="./favicon.png" type="image/png">
    <link rel="stylesheet" href="./style.css">
    <script type="module" src="./game.mjs"></script>
  </head>
  <body>
    <header class="masthead layout-width">
      <div class="brand">
        <span class="brand-icon" aria-hidden="true"><span></span></span>
        <div>
          <span class="brand-name">數迴</span>
          <span class="brand-roman" lang="en">SLITHERLINK</span>
        </div>
      </div>
      <button class="help-button" type="button" id="open-help">
        <span class="icon icon-help" aria-hidden="true">?</span> 遊戲玩法
      </button>
    </header>

    <main class="game-layout layout-width">
      <section class="paper" aria-labelledby="level-title">
        <div class="paper-heading">
          <div>
            <p class="board-size">7 × 7 棋盤</p>
            <h1 id="level-title" tabindex="-1">簡單 <span>·</span> 第 01 關</h1>
          </div>
          <div class="clock" role="timer" aria-label="遊戲用時">
            <span class="icon icon-clock" aria-hidden="true"></span>
            <span id="time">00:00</span>
          </div>
        </div>

        <div class="board-frame">
          <div id="board" class="board" role="group" aria-label="7 × 7 數迴棋盤" aria-describedby="board-instructions"></div>
          <div class="visually-hidden"><table id="clue-table"></table></div>
        </div>

        <div class="board-caption">
          <div class="caption-status">
            <span class="status-icon" aria-hidden="true"></span>
            <span id="game-status" role="status">點選兩個圓點之間的邊開始</span>
          </div>
          <span id="best-time" class="best-time" hidden></span>
          <span class="pointer-hint">右鍵標記空邊</span>
          <button type="button" id="open-result" class="result-link" hidden>查看完成結果</button>
        </div>
        <p id="board-instructions" class="visually-hidden">
          棋盤邊可用方向鍵移動、Enter 或空白鍵套用工具、X 鍵切換空邊標記。題目數字另列於棋盤後的表格。
        </p>
      </section>

      <aside class="controls" aria-label="遊戲選項">
        <section class="control-card picker" aria-labelledby="picker-title">
          <div class="card-heading">
            <h2 id="picker-title">選擇關卡</h2>
            <span id="completion">0 / 30 完成</span>
          </div>
          <div class="difficulty" role="group" aria-label="難度">
            <button type="button" data-difficulty="easy" aria-pressed="true">簡單</button>
            <button type="button" data-difficulty="medium" aria-pressed="false">中等</button>
            <button type="button" data-difficulty="hard" aria-pressed="false">困難</button>
          </div>
          <div id="levels" class="levels" role="group" aria-label="關卡"></div>
        </section>

        <section class="control-card tools" aria-labelledby="tools-title">
          <div class="card-heading"><h2 id="tools-title">作答工具</h2></div>
          <div class="drawing-tools" role="group" aria-label="指定棋盤標記">
            <button type="button" data-tool="line" aria-pressed="true">
              <span class="icon icon-line" aria-hidden="true"></span>畫線
            </button>
            <button type="button" data-tool="cross" aria-pressed="false">
              <span class="icon icon-cross" aria-hidden="true"></span>標記空邊
            </button>
          </div>
          <div class="actions">
            <button type="button" id="undo" disabled>
              <span class="icon icon-undo" aria-hidden="true">↶</span>上一步
            </button>
            <button type="button" id="restart" disabled>
              <span class="icon icon-restart" aria-hidden="true">↻</span>重新開始
            </button>
          </div>
          <button type="button" class="answer-button" id="answer">
            <span class="icon icon-eye" aria-hidden="true"></span><span id="answer-label">查看解答</span>
          </button>
        </section>
      </aside>
    </main>

    <dialog id="help-dialog" aria-labelledby="help-title">
      <form method="dialog">
        <h2 id="help-title">遊戲玩法</h2>
        <ol>
          <li>沿著圓點之間的邊畫線，圍成一條封閉迴路，線路不能分岔或交叉。</li>
          <li>每個數字代表該格四周有幾條邊需要畫線。空白格沒有指定線條數。</li>
          <li>點一下放置標記，再點一次清除。選「標記空邊」可放上 ×，電腦也可用滑鼠右鍵。</li>
        </ol>
        <button class="dialog-primary" autofocus>開始玩</button>
      </form>
    </dialog>

    <dialog id="confirm-dialog" aria-labelledby="confirm-title" aria-describedby="confirm-description">
      <form method="dialog">
        <h2 id="confirm-title"></h2>
        <p id="confirm-description"></p>
        <div class="dialog-actions">
          <button value="cancel" autofocus>取消</button>
          <button value="confirm" class="dialog-primary" id="confirm-action"></button>
        </div>
      </form>
    </dialog>

    <dialog id="result-dialog" aria-labelledby="result-title" aria-describedby="result-level result-badge">
      <div class="result-heading">
        <div>
          <h2 id="result-title">解題成功！</h2>
          <p id="result-level" class="result-level"></p>
        </div>
        <div id="result-badge" class="result-badge">
          <span class="result-badge-label"><span class="icon icon-clock" aria-hidden="true"></span>完成時間</span>
          <strong id="result-time"></strong>
        </div>
      </div>
      <div class="result-content">
        <figure id="result-character" class="result-character" hidden></figure>
        <div id="result-board" class="board-frame result-board" role="img" aria-label="已完成的數迴迴路"></div>
      </div>
      <form method="dialog" class="result-actions">
        <button class="dialog-primary" autofocus>返回棋盤</button>
      </form>
      <div class="result-confetti" aria-hidden="true">
        <span></span><span></span><span></span><span></span><span></span><span></span>
      </div>
    </dialog>
  </body>
</html>
